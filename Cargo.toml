[package]
name = "telegram-bots"
version = "0.2.0"
edition = "2021"
description = "Nix-configured Telegram bots: notify/ask plus optional slash commands"
license = "MIT"
repository = "https://github.com/danieloakman/telegram-bots"
readme = "README.md"
keywords = ["telegram", "bot", "agent", "automation", "nix"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
frankenstein = { version = "0.52.1", default-features = false, features = ["client-ureq"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.5"
uuid = { version = "1", features = ["v4"] }
